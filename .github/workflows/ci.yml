name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unibudget_test_admin
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: unibudget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unibudget_test_admin -d unibudget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUDGET_TEST_DATABASE_URL: postgresql://unibudget_test_admin:integration-only-password@127.0.0.1:5432/unibudget_test
      MIGRATION_TEST_DATABASE_URL: postgresql://unibudget_test_admin:integration-only-password@127.0.0.1:5432/unibudget_test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hello-cdk/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install CDK Dependencies
        run: npm ci
        working-directory: hello-cdk

      - name: Check Astro
        run: npm run check

      - name: Check Static Site
        run: npm run check:static

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run

      - name: Build Astro Site
        run: npm run build

      - name: Build Static Site
        run: npm run build:static

      - name: Verify Static Build Output
        run: node scripts/verifyStaticBuild.mjs

      - name: Build Docker Image
        run: docker build -f dockerfile -t unibudget:ssr .

      - name: Verify Migration Runtime Modules
        run: |
          set +e
          output=$(docker run --rm --entrypoint node unibudget:ssr ./scripts/migrate.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::Expected the migration runner to stop on missing configuration."
            exit 1
          fi
          if printf '%s' "$output" | grep -q 'ERR_MODULE_NOT_FOUND'; then
            echo "::error::The migration runner could not resolve its modules in the runtime image."
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'APP_DATABASE_PASSWORD is required'; then
            echo "::error::Unexpected migration failure; expected the missing APP_DATABASE_PASSWORD error."
            exit 1
          fi

      - name: Build CDK
        run: npm run build
        working-directory: hello-cdk

      - name: Test CDK
        run: npm test -- --runInBand
        working-directory: hello-cdk

      - name: Synthesize CDK
        run: >-
          npx cdk synth --no-lookups
          -c imageTag=ci-synth
          -c supabaseHost=aws-0-eu-central-1.pooler.supabase.com
          -c cloudFrontOriginPrefixListId=pl-0123456789abcdef0
        working-directory: hello-cdk

      - name: Synthesize Monitoring Stack
        run: >-
          npx cdk synth UniBudgetStack-Monitoring --no-lookups
          -c monitoringOnly=true
          -c desiredCount=1
          -c alarmTopicArn=arn:aws:sns:us-east-1:111111111111:unibudget-ci-alarms
          -c loadBalancerFullName=app/UniBudgetCI/1234567890abcdef
          -c targetGroupFullName=targetgroup/UniBudgetCI/1234567890abcdef
          -c clusterName=unibudget-ci-cluster
          -c serviceName=unibudget-ci-service
        working-directory: hello-cdk
