name: Deploy

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: Immutable image tag to build and deploy
        required: true
        type: string
      desiredCount:
        description: Running task count after migration (1-10); never silently scaled to zero
        required: true
        type: string
      bootstrapOnly:
        description: First deployment only - create the stack and secrets without migrating or starting the app
        required: true
        type: boolean
        default: false
      recoveryPlanVerified:
        description: Confirm a restorable Supabase backup or PITR restore point was verified for this migration
        required: true
        type: boolean
        default: false
      recoveryPointReference:
        description: Recorded Supabase backup or PITR restore point reference; required for a normal deployment
        required: false
        type: string
      recoveryPointTimestamp:
        description: UTC timestamp (YYYY-MM-DDTHH:MM:SSZ) recorded for that restore point; required for a normal deployment
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: unibudget-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  SUPABASE_HOST: ${{ vars.SUPABASE_HOST }}
  STACK_NAME: UniBudgetStack
  IMAGE_TAG: ${{ inputs.imageTag }}
  DESIRED_COUNT: ${{ inputs.desiredCount }}
  RECOVERY_POINT_REFERENCE: ${{ inputs.recoveryPointReference }}
  RECOVERY_POINT_TIMESTAMP: ${{ inputs.recoveryPointTimestamp }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Deployment Inputs
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN SUPABASE_HOST IMAGE_TAG DESIRED_COUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name must be configured for this deployment."
              exit 1
            fi
          done
          if ! [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must be a 12-digit AWS account ID."
            exit 1
          fi
          if ! [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]; then
            echo "::error::AWS_REGION is not a valid AWS region."
            exit 1
          fi
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::imageTag must be a valid container image tag."
            exit 1
          fi
          if ! [[ "$DESIRED_COUNT" =~ ^[0-9]+$ ]] || [ "$DESIRED_COUNT" -lt 1 ] || [ "$DESIRED_COUNT" -gt 10 ]; then
            echo "::error::desiredCount must be an explicit integer between 1 and 10. Use a separate stack deploy to scale down."
            exit 1
          fi
          if ! [[ "$SUPABASE_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || [[ "$SUPABASE_HOST" == *..* ]]; then
            echo "::error::SUPABASE_HOST must be the bare pooler hostname copied from the Supabase dashboard."
            exit 1
          fi
          # Hosted HTTPS comes from CloudFront's AWS-managed certificate, so no
          # APPLICATION_URL or CERTIFICATE_ARN variable is required. A migration
          # needs an explicit, human-confirmed recovery point because the
          # migration runner is forward-only.
          #
          # The reference and timestamp identify the exact restore point this run
          # was approved against, so the evidence outlives the run. They are an
          # operator attestation: the workflow records them but cannot verify
          # restorability without Supabase credentials it deliberately does not
          # hold.
          if [ "${{ inputs.bootstrapOnly }}" != "true" ]; then
            if [ "${{ inputs.recoveryPlanVerified }}" != "true" ]; then
              echo "::error::Confirm a verified, restorable Supabase backup or PITR restore point before migrating."
              exit 1
            fi
            if [ -z "${RECOVERY_POINT_REFERENCE:-}" ] || [ -z "${RECOVERY_POINT_TIMESTAMP:-}" ]; then
              echo "::error::recoveryPointReference and recoveryPointTimestamp are required for a normal deployment. Record the restore point before migrating."
              exit 1
            fi
            if ! [[ "$RECOVERY_POINT_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{7,127}$ ]]; then
              echo "::error::recoveryPointReference must be 8-128 characters using letters, digits, dot, underscore, colon, slash, or hyphen."
              exit 1
            fi
            case "${RECOVERY_POINT_REFERENCE,,}" in
              *todo*|*tbd*|*changeme*|*change-me*|*unknown*|*placeholder*|*n/a*|*none*)
                echo "::error::recoveryPointReference looks like a placeholder; record the real restore point reference."
                exit 1
                ;;
            esac
            if ! [[ "$RECOVERY_POINT_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "::error::recoveryPointTimestamp must be a UTC timestamp such as 2026-10-23T18:30:00Z."
              exit 1
            fi
            if ! recovery_epoch=$(date -u -d "$RECOVERY_POINT_TIMESTAMP" +%s 2>/dev/null); then
              echo "::error::recoveryPointTimestamp is not a valid calendar timestamp."
              exit 1
            fi
            if [ "$recovery_epoch" -gt "$(date -u +%s)" ]; then
              echo "::error::recoveryPointTimestamp is in the future; record the actual restore point."
              exit 1
            fi
            {
              echo "### Recovery attestation"
              echo ""
              echo "- Restore point: \`$RECOVERY_POINT_REFERENCE\`"
              echo "- Recorded at: \`$RECOVERY_POINT_TIMESTAMP\`"
              echo "- Restore verified out of band: yes (attested by the operator)"
              echo ""
              echo "This record is an operator attestation. The workflow does not verify restorability automatically."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: unibudget-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS Identity, CloudFront Origin Access, and Supabase Host
        id: prerequisites
        run: |
          set -euo pipefail
          caller_account=$(aws sts get-caller-identity --query Account --output text)
          if [ "$caller_account" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error::The OIDC role is in account $caller_account, not AWS_ACCOUNT_ID ($AWS_ACCOUNT_ID)."
            exit 1
          fi
          if ! getent ahosts "$SUPABASE_HOST" >/dev/null; then
            echo "::error::SUPABASE_HOST does not resolve. Copy the current session-pooler host from the Supabase dashboard."
            exit 1
          fi
          # The load balancer accepts traffic only from this AWS-managed prefix
          # list, so CloudFront is the only public path to the application and
          # the ALB is never reachable over plain HTTP from the internet.
          origin_prefix_list=$(aws ec2 describe-managed-prefix-lists \
            --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
            --query 'PrefixLists[0].PrefixListId' \
            --output text)
          if [ -z "$origin_prefix_list" ] || [ "$origin_prefix_list" = "None" ] || ! [[ "$origin_prefix_list" =~ ^pl-[0-9a-f]+$ ]]; then
            echo "::error::The CloudFront origin-facing managed prefix list is unavailable in $AWS_REGION; refusing to expose the ALB directly."
            exit 1
          fi
          echo "origin_prefix_list=$origin_prefix_list" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hello-cdk/package-lock.json

      - name: Install Application Dependencies
        run: npm ci

      # The same suite CI runs on main. A failing test stops the deployment
      # before any image is built or any AWS resource is changed.
      - name: Run Tests
        run: npm test -- --run

      - name: Install CDK Dependencies
        run: npm ci
        working-directory: hello-cdk

      - name: Determine Whether the Stack Exists
        id: stack
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            stack_exists=true
          else
            stack_exists=false
          fi
          echo "exists=$stack_exists" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.bootstrapOnly }}" = "true" ] && [ "$stack_exists" = "true" ]; then
            echo "::error::bootstrapOnly is for the first deployment, but $STACK_NAME already exists. Run a normal deployment instead."
            exit 1
          fi
          if [ "${{ inputs.bootstrapOnly }}" != "true" ] && [ "$stack_exists" = "false" ]; then
            echo "::error::$STACK_NAME does not exist. Run this workflow once with bootstrapOnly=true, populate the three Supabase secrets, then run a normal deployment."
            exit 1
          fi

      - name: Create the Initial Stack Without Starting the Application
        if: steps.stack.outputs.exists != 'true'
        env:
          UNIBUDGET_AWS_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          UNIBUDGET_AWS_REGION: ${{ env.AWS_REGION }}
          ORIGIN_PREFIX_LIST: ${{ steps.prerequisites.outputs.origin_prefix_list }}
        run: |
          set -euo pipefail
          # The ECR repository, migration task definition, load balancer, and
          # CloudFront distribution must exist before the image is pushed or a
          # migration is attempted. Desired count is hard-coded to zero until
          # the migration succeeds.
          npx cdk deploy \
            --require-approval never \
            -c imageTag="$IMAGE_TAG" \
            -c desiredCount=0 \
            -c supabaseHost="$SUPABASE_HOST" \
            -c cloudFrontOriginPrefixListId="$ORIGIN_PREFIX_LIST"
        working-directory: hello-cdk

      - name: Read Stack Outputs
        id: outputs
        run: |
          set -euo pipefail
          read_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          output_value() {
            local value
            value=$(read_output "$1")
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::Stack output $1 is missing. The stack is not deployment-ready." >&2
              exit 1
            fi
            printf '%s' "$value"
          }
          application_url=$(output_value ApplicationUrl)
          cloudfront_domain=$(output_value CloudFrontDomainName)
          # The public HTTPS URL is derived from the CloudFront distribution,
          # never supplied by a repository variable or a DNS record.
          if ! [[ "$cloudfront_domain" =~ ^[a-z0-9]+\.cloudfront\.net$ ]]; then
            echo "::error::CloudFrontDomainName ($cloudfront_domain) is not an AWS-generated CloudFront hostname."
            exit 1
          fi
          if [ "$application_url" != "https://$cloudfront_domain" ]; then
            echo "::error::ApplicationUrl ($application_url) is not the HTTPS URL of $cloudfront_domain."
            exit 1
          fi
          {
            echo "repository_uri=$(output_value ImageRepositoryUri)"
            echo "cluster=$(output_value ClusterName)"
            echo "service=$(output_value ServiceName)"
            echo "application_task_definition=$(output_value TaskDefinitionArn)"
            echo "application_task_role_arn=$(output_value ApplicationTaskRoleArn)"
            echo "application_task_execution_role_arn=$(output_value ApplicationTaskExecutionRoleArn)"
            echo "migration_task_definition=$(output_value MigrationTaskDefinitionArn)"
            echo "migration_task_role_arn=$(output_value MigrationTaskRoleArn)"
            echo "migration_task_execution_role_arn=$(output_value MigrationTaskExecutionRoleArn)"
            echo "supabase_application_secret_arn=$(output_value SupabaseApplicationSecretArn)"
            echo "supabase_migration_secret_arn=$(output_value SupabaseMigrationSecretArn)"
            echo "supabase_ca_secret_arn=$(output_value SupabaseCaSecretArn)"
            echo "security_group=$(output_value ApplicationSecurityGroupId)"
            echo "subnets=$(output_value PublicSubnetIds)"
            echo "load_balancer_dns=$(output_value LoadBalancerDnsName)"
            echo "cloudfront_distribution_id=$(output_value CloudFrontDistributionId)"
            echo "cloudfront_domain_name=$cloudfront_domain"
            echo "application_url=$application_url"
          } >> "$GITHUB_OUTPUT"

      - name: Verify CloudFront Delivery Configuration
        if: inputs.bootstrapOnly != true
        env:
          DISTRIBUTION_ID: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
          CLOUDFRONT_DOMAIN: ${{ steps.outputs.outputs.cloudfront_domain_name }}
          APPLICATION_URL: ${{ steps.outputs.outputs.application_url }}
          LOAD_BALANCER_DNS: ${{ steps.outputs.outputs.load_balancer_dns }}
          CLUSTER: ${{ steps.outputs.outputs.cluster }}
          SERVICE: ${{ steps.outputs.outputs.service }}
        run: |
          set -euo pipefail
          if [ -z "$DISTRIBUTION_ID" ] || [ -z "$CLOUDFRONT_DOMAIN" ] || [ -z "$LOAD_BALANCER_DNS" ]; then
            echo "::error::CloudFront or load balancer stack outputs are empty; refusing to migrate without a verified public HTTPS entry point."
            exit 1
          fi
          if [ "$APPLICATION_URL" != "https://$CLOUDFRONT_DOMAIN" ]; then
            echo "::error::ApplicationUrl is not the CloudFront HTTPS URL."
            exit 1
          fi
          status=$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION_ID" \
            --query 'Distribution.Status' \
            --output text)
          if [ "$status" != "Deployed" ]; then
            echo "::error::CloudFront distribution $DISTRIBUTION_ID is $status, not Deployed."
            exit 1
          fi
          config=$(aws cloudfront get-distribution-config \
            --id "$DISTRIBUTION_ID" \
            --query 'DistributionConfig' \
            --output json)
          require_config() {
            local label=$1 actual=$2 expected=$3
            if [ "$actual" != "$expected" ]; then
              echo "::error::CloudFront $label is '$actual', expected '$expected'."
              exit 1
            fi
          }
          require_config "enabled" "$(jq -r '.Enabled' <<<"$config")" "true"
          require_config "custom domain count" "$(jq -r '(.Aliases.Items // []) | length' <<<"$config")" "0"
          acm_certificate=$(jq -r '.ViewerCertificate.ACMCertificateArn // empty' <<<"$config")
          if [ -n "$acm_certificate" ]; then
            echo "::error::CloudFront uses ACM certificate $acm_certificate; this deployment must use the AWS-managed default certificate."
            exit 1
          fi
          require_config "origin count" "$(jq -r '.Origins | length' <<<"$config")" "1"
          require_config "origin" "$(jq -r '.Origins[0].DomainName' <<<"$config")" "$LOAD_BALANCER_DNS"
          require_config "viewer protocol" "$(jq -r '.DefaultCacheBehavior.ViewerProtocolPolicy' <<<"$config")" "redirect-to-https"
          # CachingDisabled: no user-specific HTML, session, or API response may
          # be stored at the edge. AllViewer forwards every header (including
          # Host), all cookies (the session cookie), and all query strings.
          require_config "cache policy" "$(jq -r '.DefaultCacheBehavior.CachePolicyId' <<<"$config")" "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
          require_config "origin request policy" "$(jq -r '.DefaultCacheBehavior.OriginRequestPolicyId' <<<"$config")" "216adef6-5c7f-47e4-b989-5492eafa07d3"
          # A cache behavior could re-enable caching or route some paths to a
          # different origin, a custom error response could turn an origin
          # failure into a 200 page, and an edge function could synthesize a
          # response without contacting the origin at all. The CDK distribution
          # defines none of them, so any presence is drift and fails closed.
          require_config "cache behavior count" "$(jq -r '(.CacheBehaviors.Items // []) | length' <<<"$config")" "0"
          require_config "custom error response count" "$(jq -r '(.CustomErrorResponses.Items // []) | length' <<<"$config")" "0"
          require_config "CloudFront function association count" "$(jq -r '(.DefaultCacheBehavior.FunctionAssociations.Items // []) | length' <<<"$config")" "0"
          require_config "Lambda@Edge association count" "$(jq -r '(.DefaultCacheBehavior.LambdaFunctionAssociations.Items // []) | length' <<<"$config")" "0"
          methods=$(jq -r '.DefaultCacheBehavior.AllowedMethods | (.Items // []) | sort | join(",")' <<<"$config")
          if [ "$methods" != "DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT" ]; then
            echo "::error::CloudFront allowed methods are $methods; POST, PUT, PATCH, and DELETE must reach the application."
            exit 1
          fi
          # Exercise the public HTTPS path before any image is pushed or a
          # migration starts. The redirect check above is answered by CloudFront
          # at the edge, so on its own it proves nothing about the origin. Only
          # a real response from the application proves delivery works.
          service_state=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount}' \
            --output json)
          current_desired=$(jq -r '.desired // empty' <<<"$service_state")
          running_count=$(jq -r '.running // empty' <<<"$service_state")
          if ! [[ "$current_desired" =~ ^[0-9]+$ ]] || ! [[ "$running_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the ECS service state; refusing to migrate without verifying the origin."
            exit 1
          fi

          login_path=/login
          login_http_url="http://$CLOUDFRONT_DOMAIN$login_path"
          login_https_url="https://$CLOUDFRONT_DOMAIN$login_path"
          response_dir=$(mktemp -d)
          trap 'rm -rf "$response_dir"' EXIT

          request() {
            local label=$1 url=$2
            curl --silent --show-error --max-redirs 0 \
              --proto-redir '=https' \
              --tlsv1.2 --connect-timeout 15 --max-time 30 \
              --retry 3 --retry-delay 3 --retry-connrefused \
              --dump-header "$response_dir/$label.headers" \
              --output "$response_dir/$label.body" \
              --write-out '%{http_code} %{redirect_url}' \
              "$url"
          }

          # The plain HTTP entry point must redirect to this distribution's own
          # HTTPS hostname and the same path; an off-host redirect fails here.
          if ! http_result=$(request http "$login_http_url"); then
            echo "::error::$login_http_url could not be reached."
            exit 1
          fi
          read -r http_code http_redirect <<<"$http_result"
          case "$http_code" in
            301|302|303|307|308) ;;
            *)
              echo "::error::$login_http_url returned $http_code instead of redirecting to HTTPS."
              exit 1
              ;;
          esac
          if [ "$http_redirect" != "$login_https_url" ]; then
            echo "::error::CloudFront redirected to '$http_redirect' instead of $login_https_url."
            exit 1
          fi

          # Follow at most two HTTPS redirects, and only on the expected
          # CloudFront hostname. The final response must be the application's
          # login page; an origin 403 or any other 5xx never counts as success.
          if ! https_result=$(request https "$http_redirect"); then
            echo "::error::$login_https_url could not be reached over HTTPS."
            exit 1
          fi
          read -r login_code login_redirect <<<"$https_result"
          for _ in 1 2; do
            case "$login_code" in
              301|302|303|307|308)
                if [[ "$login_redirect" != "https://$CLOUDFRONT_DOMAIN/"* ]] || [[ "$login_redirect" == *"@"* ]] || [[ "$login_redirect" =~ [[:space:]] ]]; then
                  echo "::error::The login page redirected outside https://$CLOUDFRONT_DOMAIN (to '$login_redirect')."
                  exit 1
                fi
                if ! https_result=$(request https "$login_redirect"); then
                  echo "::error::The login redirect target '$login_redirect' could not be reached."
                  exit 1
                fi
                read -r login_code login_redirect <<<"$https_result"
                ;;
              *) break ;;
            esac
          done

          # x-amz-cf-id proves the response traversed CloudFront; without it the
          # body cannot be attributed to this distribution at all.
          if ! grep -qi '^x-amz-cf-id:' "$response_dir/https.headers"; then
            echo "::error::$login_https_url did not return a CloudFront response; refusing to treat it as an origin check."
            exit 1
          fi
          x_cache=$(grep -i '^x-cache:' "$response_dir/https.headers" | tail -n 1 | tr -d '\r' || true)

          if [ "$login_code" = "403" ]; then
            echo "::error::$login_https_url returned HTTP 403; the origin or edge is refusing requests."
            exit 1
          fi
          if [ "$login_code" = "503" ]; then
            # A service deliberately scaled to zero (the first normal deployment
            # after bootstrap, or a maintenance window) has no tasks, so the ALB
            # answers 503 and CloudFront labels it an edge error rather than a
            # cache miss. Nothing in that response proves the origin delivered
            # it: CloudFront's own 503 carries the same evidence. The gate
            # therefore tolerates this state only while the service really is at
            # zero tasks, and only for a response that carries CloudFront
            # evidence; neither condition proves origin delivery.
            if [ "$current_desired" = "0" ] && [ "$running_count" = "0" ]; then
              if [[ "$x_cache" != *" from cloudfront"* ]]; then
                echo "::error::The ECS service is scaled to zero, so origin delivery cannot be verified, and $login_https_url did not return the expected CloudFront X-Cache evidence (X-Cache: '${x_cache:-<absent>}'). Deploy the stack with desiredCount >= 1 and re-run, or inspect the X-Cache header on that response."
                exit 1
              fi
              echo "::warning::The ECS service is scaled to zero (desired=0); $login_https_url returned 503 through CloudFront. CloudFront responded for this distribution, but origin delivery is not proven while there are zero running tasks. The migration may proceed; the rollout that follows is the first proof the application can start."
            else
              echo "::error::$login_https_url returned HTTP 503 while the service should be running (desired=$current_desired, running=$running_count); refusing to migrate against an unhealthy origin."
              exit 1
            fi
          elif [ "$login_code" != "200" ]; then
            echo "::error::$login_https_url returned HTTP $login_code instead of the login page."
            exit 1
          else
            if [[ "$x_cache" != *"Miss from cloudfront"* ]]; then
              echo "::error::$login_https_url was not a CloudFront cache miss; refusing to treat a cached or edge-generated page as the origin."
              exit 1
            fi
            content_type=$(grep -i '^content-type:' "$response_dir/https.headers" | tail -n 1 | tr -d '\r' || true)
            if [[ "$content_type" != *"text/html"* ]]; then
              echo "::error::$login_https_url returned '$content_type' instead of an HTML login page."
              exit 1
            fi
            if ! grep -q 'id="loginForm"' "$response_dir/https.body"; then
              echo "::error::$login_https_url did not return the UniBudget login page; the origin is not serving the application."
              exit 1
            fi
            echo "The origin answered $login_https_url with the UniBudget login page (HTTP 200)."
          fi
          echo "CloudFront serves https://$CLOUDFRONT_DOMAIN from $LOAD_BALANCER_DNS with caching disabled; the origin was verified before any migration."

      - name: Build and Push Application Image
        if: inputs.bootstrapOnly != true
        id: image
        env:
          REPOSITORY_URI: ${{ steps.outputs.outputs.repository_uri }}
        run: |
          set -euo pipefail
          expected_prefix="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/"
          if [[ "$REPOSITORY_URI" != "$expected_prefix"* ]]; then
            echo "::error::The ECR output is not a repository URI in this account and region."
            exit 1
          fi
          repository_name=${REPOSITORY_URI#"$expected_prefix"}
          if [ -z "$repository_name" ] || [[ "$repository_name" == *".amazonaws.com"* ]]; then
            echo "::error::The ECR stack output does not contain a repository name."
            exit 1
          fi
          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::Image tag $IMAGE_TAG already exists and tags are immutable. Choose a new tag."
            exit 1
          fi
          image_uri="$REPOSITORY_URI:$IMAGE_TAG"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          # The tag is the release version; the commit is recorded as OCI
          # metadata so the image remains traceable without a second ECR tag
          # (which would double its lifecycle-policy footprint).
          docker build -f dockerfile \
            --build-arg IMAGE_VERSION="$IMAGE_TAG" \
            --build-arg GIT_REVISION="${GITHUB_SHA:-unknown}" \
            -t "$image_uri" .
          docker push "$image_uri"
          aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text >/dev/null
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Validate Migration Task Configuration
        if: inputs.bootstrapOnly != true
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          APPLICATION_TASK_DEFINITION: ${{ steps.outputs.outputs.application_task_definition }}
          APPLICATION_TASK_ROLE_ARN: ${{ steps.outputs.outputs.application_task_role_arn }}
          APPLICATION_TASK_EXECUTION_ROLE_ARN: ${{ steps.outputs.outputs.application_task_execution_role_arn }}
          MIGRATION_TASK_DEFINITION: ${{ steps.outputs.outputs.migration_task_definition }}
          MIGRATION_TASK_ROLE_ARN: ${{ steps.outputs.outputs.migration_task_role_arn }}
          MIGRATION_TASK_EXECUTION_ROLE_ARN: ${{ steps.outputs.outputs.migration_task_execution_role_arn }}
          SUPABASE_APPLICATION_SECRET_ARN: ${{ steps.outputs.outputs.supabase_application_secret_arn }}
          SUPABASE_MIGRATION_SECRET_ARN: ${{ steps.outputs.outputs.supabase_migration_secret_arn }}
          SUPABASE_CA_SECRET_ARN: ${{ steps.outputs.outputs.supabase_ca_secret_arn }}
          CLUSTER: ${{ steps.outputs.outputs.cluster }}
          SERVICE: ${{ steps.outputs.outputs.service }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_URI:-}" ]; then
            echo "::error::The built image URI is empty; refusing to migrate without the image this run built."
            exit 1
          fi
          cluster_status=$(aws ecs describe-clusters \
            --clusters "$CLUSTER" \
            --query 'clusters[0].status' \
            --output text)
          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "::error::ECS cluster $CLUSTER is $cluster_status, not ACTIVE."
            exit 1
          fi
          service_status=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].status' \
            --output text)
          if [ "$service_status" != "ACTIVE" ]; then
            echo "::error::ECS service $SERVICE is $service_status, not ACTIVE."
            exit 1
          fi

          require_role_arn() {
            local label=$1 actual=$2 expected=$3
            if [ -z "$actual" ] || [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
              echo "::error::The $label is '$actual', expected '$expected' from the stack output."
              exit 1
            fi
          }

          application_task_json=$(aws ecs describe-task-definition \
            --task-definition "$APPLICATION_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json)
          require_role_arn \
            "application task role" \
            "$(jq -r '.taskRoleArn // empty' <<<"$application_task_json")" \
            "$APPLICATION_TASK_ROLE_ARN"
          require_role_arn \
            "application task execution role" \
            "$(jq -r '.executionRoleArn // empty' <<<"$application_task_json")" \
            "$APPLICATION_TASK_EXECUTION_ROLE_ARN"

          app_container=$(jq -c '.containerDefinitions[] | select(.name == "ApplicationContainer")' <<<"$application_task_json")
          if [ -z "$app_container" ]; then
            echo "::error::ApplicationContainer is missing from $APPLICATION_TASK_DEFINITION."
            exit 1
          fi
          # A URL override would bypass the validated PGHOST/PGPORT and could point
          # the application at a different database than the one being migrated.
          if jq -e '.environment[] | select(.name | test("(^|_)DATABASE_URL$"))' >/dev/null <<<"$app_container"; then
            echo "::error::The application task sets a database URL override; its connection must come only from PGHOST, PGPORT, PGDATABASE, PGUSER, and PGPASSWORD."
            exit 1
          fi
          app_environment_names=$(jq -r '[.environment[].name] | sort | join(" ")' <<<"$app_container")
          expected_app_environment="HOST NODE_ENV PGDATABASE PGHOST PGPORT PGSSLMODE PORT"
          if [ "$app_environment_names" != "$expected_app_environment" ]; then
            echo "::error::Application task environment names are [$app_environment_names], expected exactly [$expected_app_environment]. Remove any added variable and deploy the stack again."
            exit 1
          fi
          if [ "$(jq -r '(.environmentFiles // []) | length' <<<"$app_container")" != "0" ]; then
            echo "::error::Application task uses environmentFiles; remove them so a file cannot override the validated environment."
            exit 1
          fi
          app_environment_value() {
            jq -r --arg name "$1" \
              '.environment[] | select(.name == $name) | .value' <<<"$app_container"
          }
          require_app_environment() {
            local name=$1 expected=$2 actual
            actual=$(app_environment_value "$name")
            if [ "$actual" != "$expected" ]; then
              echo "::error::Application task $name is not '$expected'. Deploy the stack with the current Supabase configuration before migrating."
              exit 1
            fi
          }
          require_app_environment NODE_ENV production
          require_app_environment HOST 0.0.0.0
          require_app_environment PORT 8080
          require_app_environment PGHOST "$SUPABASE_HOST"
          require_app_environment PGPORT 5432
          require_app_environment PGDATABASE postgres
          require_app_environment PGSSLMODE verify-full

          expected_app_secrets="PGPASSWORD PGUSER SUPABASE_CA_CERT"
          actual_app_secrets=$(jq -r '[.secrets[].name] | sort | join(" ")' <<<"$app_container")
          if [ "$actual_app_secrets" != "$expected_app_secrets" ]; then
            echo "::error::Application task secret names are [$actual_app_secrets], expected exactly [$expected_app_secrets]. Only names are shown; secret values are never read here."
            exit 1
          fi
          # The expected value is the stack ARN plus the exact JSON key. A prefix
          # or wildcard match would let PGUSER and PGPASSWORD swap, or accept a
          # different secret whose ARN merely contains this one.
          require_app_secret() {
            local name=$1 arn=$2 suffix=$3 count actual
            if [ -z "$arn" ]; then
              echo "::error::The stack output for $name's secret ARN is empty."
              exit 1
            fi
            count=$(jq --arg name "$name" \
              '[.secrets[] | select(.name == $name)] | length' <<<"$app_container")
            if [ "$count" -ne 1 ]; then
              echo "::error::Application task must reference $name exactly once; found $count."
              exit 1
            fi
            actual=$(jq -r --arg name "$name" \
              '.secrets[] | select(.name == $name) | .valueFrom' <<<"$app_container")
            if [ "$actual" != "$arn$suffix" ]; then
              echo "::error::Application task $name does not reference the expected Secrets Manager ARN and JSON key."
              exit 1
            fi
          }
          require_app_secret PGUSER "$SUPABASE_APPLICATION_SECRET_ARN" ':username::'
          require_app_secret PGPASSWORD "$SUPABASE_APPLICATION_SECRET_ARN" ':password::'
          require_app_secret SUPABASE_CA_CERT "$SUPABASE_CA_SECRET_ARN" ''

          task_json=$(aws ecs describe-task-definition \
            --task-definition "$MIGRATION_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json)
          require_role_arn \
            "migration task role" \
            "$(jq -r '.taskRoleArn // empty' <<<"$task_json")" \
            "$MIGRATION_TASK_ROLE_ARN"
          require_role_arn \
            "migration task execution role" \
            "$(jq -r '.executionRoleArn // empty' <<<"$task_json")" \
            "$MIGRATION_TASK_EXECUTION_ROLE_ARN"

          container=$(jq -c '.containerDefinitions[] | select(.name == "MigrationContainer")' <<<"$task_json")
          if [ -z "$container" ]; then
            echo "::error::MigrationContainer is missing from $MIGRATION_TASK_DEFINITION."
            exit 1
          fi
          command=$(jq -r '.command | join(" ")' <<<"$container")
          if [ "$command" != "node ./scripts/migrate.mjs" ]; then
            echo "::error::MigrationContainer does not run the migration entrypoint."
            exit 1
          fi

          environment_value() {
            jq -r --arg name "$1" \
              '.environment[] | select(.name == $name) | .value' <<<"$container"
          }
          require_environment() {
            actual=$(environment_value "$1")
            if [ "$actual" != "$2" ]; then
              echo "::error::Migration task $1 is '$actual', expected '$2'. Deploy the stack with the current Supabase configuration before migrating."
              exit 1
            fi
          }
          require_environment NODE_ENV production
          require_environment PGHOST "$SUPABASE_HOST"
          require_environment PGPORT 5432
          require_environment PGDATABASE postgres
          require_environment PGSSLMODE verify-full

          expected_secrets="APP_DATABASE_PASSWORD PGPASSWORD PGUSER SUPABASE_CA_CERT"
          actual_secrets=$(jq -r '[.secrets[].name] | sort | join(" ")' <<<"$container")
          if [ "$actual_secrets" != "$expected_secrets" ]; then
            echo "::error::Migration task secret names are $actual_secrets, expected $expected_secrets."
            exit 1
          fi
          require_exact_secret() {
            local name=$1 arn=$2 suffix=$3 count actual expected
            if [ -z "$arn" ]; then
              echo "::error::The stack output for $name's secret ARN is empty."
              exit 1
            fi
            count=$(jq --arg name "$name" \
              '[.secrets[] | select(.name == $name)] | length' <<<"$container")
            if [ "$count" -ne 1 ]; then
              echo "::error::Migration task must reference $name exactly once; found $count."
              exit 1
            fi
            actual=$(jq -r --arg name "$name" \
              '.secrets[] | select(.name == $name) | .valueFrom' <<<"$container")
            # A JSON-key reference is exactly <arn>:<key>::, so the expected
            # value is this stack ARN plus this variable's own key. The exact
            # comparison rejects a bare ARN, a wildcard suffix, another secret
            # whose name contains this one, and PGUSER referencing the password
            # key (or the reverse).
            expected="$arn$suffix"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Migration task $name does not reference the expected Secrets Manager ARN and JSON key."
              exit 1
            fi
          }
          require_exact_secret PGUSER "$SUPABASE_MIGRATION_SECRET_ARN" ':username::'
          require_exact_secret PGPASSWORD "$SUPABASE_MIGRATION_SECRET_ARN" ':password::'
          require_exact_secret APP_DATABASE_PASSWORD "$SUPABASE_APPLICATION_SECRET_ARN" ':password::'
          require_exact_secret SUPABASE_CA_CERT "$SUPABASE_CA_SECRET_ARN" ''

          echo "Migration task configuration matches the current host, role ARNs, and exact secret ARNs and JSON keys."

      - name: Run the One-Off Migration Task
        if: inputs.bootstrapOnly != true
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          MIGRATION_TASK_DEFINITION: ${{ steps.outputs.outputs.migration_task_definition }}
          CLUSTER: ${{ steps.outputs.outputs.cluster }}
          SECURITY_GROUP: ${{ steps.outputs.outputs.security_group }}
          SUBNETS: ${{ steps.outputs.outputs.subnets }}
        run: |
          set -euo pipefail
          task_arn=""
          task_finished="false"
          temporary_task_definition=""
          definition_file=$(mktemp)
          registration_file=$(mktemp)

          cleanup() {
            status=$?
            trap - EXIT
            if [ -n "$task_arn" ] && [ "$task_finished" != "true" ]; then
              echo "::warning::Migration task was interrupted; stopping $task_arn."
              aws ecs stop-task \
                --cluster "$CLUSTER" \
                --task "$task_arn" \
                --reason "Deployment cancelled or migration step failed" >/dev/null || true
            fi
            # Deregister only after the one-off task has stopped or was never
            # started. The revision is never used by the ECS service, so this
            # cannot change the application rollout or its rollback target.
            if [ -n "$temporary_task_definition" ]; then
              if [ -z "$task_arn" ] || [ "$task_finished" = "true" ]; then
                echo "Deregistering temporary migration task definition $temporary_task_definition."
                aws ecs deregister-task-definition \
                  --task-definition "$temporary_task_definition" >/dev/null || \
                  echo "::warning::Could not deregister $temporary_task_definition."
              else
                echo "::warning::Leaving $temporary_task_definition registered because the migration task has not stopped."
              fi
            fi
            rm -f "$definition_file" "$registration_file"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT TERM

          # ECS container overrides have no image field (the API rejects it with
          # ParamValidation). Build a one-off revision from the stack's current
          # migration definition with only its image replaced by the immutable
          # tag this run built. Roles, environment, secrets, logging, runtime
          # platform, and command are preserved by the builder.
          aws ecs describe-task-definition \
            --task-definition "$MIGRATION_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json > "$definition_file"

          node scripts/migrationTaskDefinition.mjs \
            "$definition_file" "$IMAGE_URI" > "$registration_file"

          temporary_task_definition=$(aws ecs register-task-definition \
            --cli-input-json "file://$registration_file" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          if [ -z "$temporary_task_definition" ] || [ "$temporary_task_definition" = "None" ]; then
            echo "::error::ECS did not return an ARN for the temporary migration task definition."
            temporary_task_definition=""
            exit 1
          fi
          echo "Registered temporary migration task definition: $temporary_task_definition"

          registered_image=$(aws ecs describe-task-definition \
            --task-definition "$temporary_task_definition" \
            --query "taskDefinition.containerDefinitions[?name=='MigrationContainer'].image" \
            --output text)
          if [ "$registered_image" != "$IMAGE_URI" ]; then
            echo "::error::The temporary migration task definition runs $registered_image, not $IMAGE_URI from this build."
            exit 1
          fi

          # One run-task call returns both the ARN and, when the task could not
          # be placed, the failure reason. Never retry here: a retry could start
          # a second migration.
          run_output=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$temporary_task_definition" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --query '[tasks[0].taskArn, failures[0].reason]' \
            --output text)
          IFS=$'\t' read -r task_arn failure_reason <<<"$run_output"
          if [ "$task_arn" = "None" ]; then
            task_arn=""
          fi
          if [ -z "$task_arn" ]; then
            echo "::error::ECS did not start the migration task: ${failure_reason:-unknown reason}"
            exit 1
          fi
          echo "Started migration task: $task_arn"

          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            last_status=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].lastStatus' \
              --output text)
            if [ "$last_status" = "STOPPED" ]; then
              task_finished="true"
              break
            fi
            sleep 10
          done
          if [ "$task_finished" != "true" ]; then
            echo "::error::Migration task did not finish within 30 minutes; stopping it."
            aws ecs stop-task \
              --cluster "$CLUSTER" \
              --task "$task_arn" \
              --reason "Migration exceeded the 30-minute deployment limit" >/dev/null || true
            # stop-task is asynchronous. Cleanup may only deregister the
            # temporary revision once ECS reports STOPPED, so wait for that
            # instead of assuming the stop request finished the task. If this
            # bounded wait expires, task_finished stays false and cleanup
            # leaves the revision registered.
            stop_deadline=$((SECONDS + 120))
            while [ "$SECONDS" -lt "$stop_deadline" ]; do
              last_status=$(aws ecs describe-tasks \
                --cluster "$CLUSTER" \
                --tasks "$task_arn" \
                --query 'tasks[0].lastStatus' \
                --output text)
              if [ "$last_status" = "STOPPED" ]; then
                task_finished="true"
                break
              fi
              sleep 5
            done
            if [ "$task_finished" != "true" ]; then
              echo "::warning::Migration task $task_arn has not reached STOPPED; leaving the temporary task definition registered."
            fi
            exit 1
          fi

          stopped_reason=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].stoppedReason' \
            --output text)
          exit_codes=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].containers[*].exitCode' \
            --output text)
          if [ "$exit_codes" != "0" ]; then
            echo "::error::Migration task stopped with exit codes [$exit_codes]: $stopped_reason"
            exit 1
          fi
          echo "Migration task completed successfully."

      - name: Deploy the Stack with the Migrated Image
        if: inputs.bootstrapOnly != true
        env:
          UNIBUDGET_AWS_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          UNIBUDGET_AWS_REGION: ${{ env.AWS_REGION }}
          ORIGIN_PREFIX_LIST: ${{ steps.prerequisites.outputs.origin_prefix_list }}
        run: |
          set -euo pipefail
          # Rollout happens only after the migration succeeded. desiredCount is
          # validated above and is never defaulted to zero.
          npx cdk deploy \
            --require-approval never \
            -c imageTag="$IMAGE_TAG" \
            -c desiredCount="$DESIRED_COUNT" \
            -c supabaseHost="$SUPABASE_HOST" \
            -c cloudFrontOriginPrefixListId="$ORIGIN_PREFIX_LIST"
        working-directory: hello-cdk

      - name: Wait for the ECS Service
        if: inputs.bootstrapOnly != true
        env:
          CLUSTER: ${{ steps.outputs.outputs.cluster }}
          SERVICE: ${{ steps.outputs.outputs.service }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Verify the Running Image
        if: inputs.bootstrapOnly != true
        env:
          CLUSTER: ${{ steps.outputs.outputs.cluster }}
          SERVICE: ${{ steps.outputs.outputs.service }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -euo pipefail
          # A circuit-breaker rollback can leave the old task set healthy. Do
          # not report success unless the service is actually running the image
          # built by this workflow.
          service_json=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0]' \
            --output json)
          rollout_state=$(jq -r '.deployments[] | select(.status == "PRIMARY") | .rolloutState // empty' <<<"$service_json")
          if [ "$rollout_state" != "COMPLETED" ]; then
            echo "::error::The primary ECS deployment is '$rollout_state', not COMPLETED. A rollback may have occurred."
            exit 1
          fi
          task_definition=$(jq -r '.taskDefinition // empty' <<<"$service_json")
          running_image=$(aws ecs describe-task-definition \
            --task-definition "$task_definition" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)
          if [ "$running_image" != "$IMAGE_URI" ]; then
            echo "::error::The ECS service is running $running_image, not the image built by this workflow ($IMAGE_URI)."
            exit 1
          fi
          echo "ECS service is running the expected image."

      - name: Verify Application Health Through CloudFront
        if: inputs.bootstrapOnly != true
        env:
          APPLICATION_URL: ${{ steps.outputs.outputs.application_url }}
        run: |
          set -euo pipefail
          if [ -z "$APPLICATION_URL" ] || ! [[ "$APPLICATION_URL" =~ ^https://[a-z0-9]+\.cloudfront\.net$ ]]; then
            echo "::error::The stack did not provide an HTTPS CloudFront application URL."
            exit 1
          fi
          health_url="${APPLICATION_URL%/}/api/health"
          response=$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "$health_url")
          if ! jq -e '.status == "ok"' >/dev/null <<<"$response"; then
            echo "::error::Health endpoint returned an unexpected response."
            exit 1
          fi
          login_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "${APPLICATION_URL%/}/login")
          if [ "$login_code" != "200" ]; then
            echo "::error::The login page returned $login_code through CloudFront."
            exit 1
          fi

          # A healthy API and login page do not prove a dynamic content route
          # renders: /blog/:slug returned 500 in production while /api/health
          # was green. Render one real entry from this build so a regression in
          # the route (rather than in the content itself) fails the deployment.
          # sed rather than head keeps the pipeline free of SIGPIPE under
          # `set -o pipefail` when the content directory has many entries.
          sample_slug=$(find src/content/blog -type f \( -name '*.md' -o -name '*.mdx' \) \
            | sort | sed -n '1p')
          if [ -z "$sample_slug" ]; then
            echo "::error::No blog content entry was found to verify the dynamic blog route."
            exit 1
          fi
          sample_slug=${sample_slug#src/content/blog/}
          sample_slug=${sample_slug%.*}
          blog_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 12 --retry-delay 5 --retry-connrefused \
            "${APPLICATION_URL%/}/blog/${sample_slug}")
          if [ "$blog_code" != "200" ]; then
            echo "::error::The blog post /blog/${sample_slug} returned $blog_code through CloudFront."
            exit 1
          fi
          echo "Blog route /blog/${sample_slug} rendered through CloudFront."
          echo "Application is healthy at $health_url"
